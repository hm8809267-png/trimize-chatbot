<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مساعد تريمايز الذكي لخدمة العملاء">
  <title>مساعد تريمايز الذكي</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="page">
    <section class="chat-card" aria-label="مساعد تريمايز">

      <header class="chat-header">
        <div class="brand-row">
          <div>
            <h1>مساعد تريمايز <span class="brand-mark">〉</span></h1>
            <div class="status">
              <span class="status-dot"></span>
              <span>متصل الآن</span>
            </div>
          </div>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div id="loading" class="loading" style="display:none;">
        جاري التفكير...
      </div>

      <footer class="chat-input-area">
        <button id="sendButton" class="send-button" type="button" aria-label="إرسال">
          <span>➤</span>
        </button>
        <input id="userInput" type="text" placeholder="اكتب سؤالك هنا..." aria-label="اكتب سؤالك هنا">
      </footer>

    </section>
  </main>

  <!-- Modal -->
  <div id="escalationModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2>تواصل مع فريق الدعم</h2>
      <p>من فضلك اترك بياناتك وسيتواصل معك أحد ممثلي خدمة العملاء في أقرب وقت.</p>
      
      <form id="escalationForm">
        <div class="form-group">
          <label for="name">الاسم:</label>
          <input type="text" id="name" name="name" required placeholder="اكتب اسمك">
        </div>
        
        <div class="form-group">
          <label for="phone">رقم الهاتف:</label>
          <input type="tel" id="phone" name="phone" required placeholder="اكتب رقم هاتفك أو واتساب">
        </div>
        
        <div class="form-group">
          <label for="notes">ملاحظات إضافية (اختياري):</label>
          <textarea id="notes" name="notes" placeholder="أي تفاصيل أخرى حابب توضحها..."></textarea>
        </div>
        
        <button type="submit" class="submit-btn">إرسال</button>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
