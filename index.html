<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مساعد تريمايز الذكي لخدمة العملاء">
  <title>مساعد تريمايز</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="page">
    <section class="chat-card" aria-label="مساعد تريمايز">
      <header class="chat-header">
        <div class="brand-row">
          <div>
            <h1>مساعد تريمايز <span class="brand-mark">〉</span></h1>
            <div class="status">
              <span class="status-dot"></span>
              <span>متصل الآن</span>
            </div>
          </div>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div id="loading" class="loading" style="display:none;">
        جاري التفكير...
      </div>

      <footer class="chat-input-area">
        <button id="sendButton" class="send-button" type="button" aria-label="إرسال">
          <span>➤</span>
        </button>

        <input
          id="userInput"
          type="text"
          autocomplete="off"
          placeholder="اكتب سؤالك هنا..."
          aria-label="اكتب سؤالك"
        >
      </footer>
    </section>
  </main>

  <div id="escalationModal" class="modal" style="display:none;">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-modal" type="button" onclick="closeModal()" aria-label="إغلاق">×</button>

      <h2 id="modalTitle">تواصل مع فريق الدعم</h2>
      <p>سيب بياناتك وفريق تريمايز هيتواصل معاك.</p>

      <form id="escalationForm">
        <label for="name">الاسم</label>
        <input id="name" name="name" type="text" required>

        <label for="phone">رقم الموبايل</label>
        <input id="phone" name="phone" type="tel" required>

        <label for="message">ملاحظات إضافية</label>
        <textarea id="message" name="message" rows="4"></textarea>

        <button type="submit" class="submit-button">إرسال</button>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
